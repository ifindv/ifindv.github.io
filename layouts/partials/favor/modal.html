{{/*
  layouts/favor/partials/modal.html
  详情弹窗 - 静态结构,JS 负责内容注入
*/}}
<div id="favor-modal" class="favor-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="favor-modal-title">
  <div class="favor-modal-panel">

    <div class="favor-modal-hero">
      <img id="favor-modal-cover" alt="" />
      <div class="favor-modal-hero-overlay"></div>
      <span id="favor-modal-type" class="favor-type-tag"></span>
      <button id="favor-modal-close" class="favor-modal-close" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M6 6l12 12M6 18L18 6"/>
        </svg>
      </button>
      <div class="favor-modal-hero-text">
        <h2 id="favor-modal-title"></h2>
        <p id="favor-modal-subtitle"></p>
      </div>
    </div>

    <div class="favor-modal-meta">
      <dl id="favor-modal-meta-list"></dl>
    </div>

    <div class="favor-modal-body">
      <div id="favor-modal-body" class="favor-md"></div>
    </div>

    <div class="favor-modal-nav">
      <button id="favor-modal-prev">← 上一项</button>
      <span id="favor-modal-position"></span>
      <button id="favor-modal-next">下一项 →</button>
    </div>

  </div>
</div>
