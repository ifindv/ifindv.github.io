baseURL: https://ifindv.github.io/
languageCode: zh-cn
title: ifindv's Blog
theme: blowfish
defaultContentLanguage: zh-cn

enableRobotsTXT: true
summaryLength: 30
hasCJKLanguage: true

enableEmoji: true

pagination:
  pagerSize: 10

imaging:
  anchor: center

taxonomies:
  tag: tags
  category: categories
  author: authors
  series: series

outputs:
  home:
    - HTML
    - RSS
    - JSON

author:
  name: ifindv
  email: your.email@example.com

params:
  description: "技术分享与个人思考"
  author:
    name: "ifindv"
    image: "/img/avatar.jpg"
  defaultAppearance: "dark"
  autoSwitchAppearance: true
  enableSearch: true
  enableCodeCopy: true
  smartTOC: true
  smartTOCHideUnfocusedChildren: false
  mainSections: ["posts"]

  colorScheme: "blowfish"

  # Umami Cloud（免费档：10 万 events/月，6 个月留存）
  # websiteid 在 https://cloud.umami.is 添加站点后获取
  umamiAnalytics:
    websiteid: "96dc4fa1-29dd-4a84-afbb-2a0ab7765002"
    # 脚本域名，默认走官方 cloud.umami.is；自建时改成自己的域名
    domain: "cloud.umami.is"
    scriptName: "script.js"
    # 尊重访客浏览器的 Do Not Track
    doNotTrack: true

  header:
    layout: "fixed"

  footer:
    showCopyright: true
    showThemeAttribution: true
    showAppearanceSwitcher: true
    showScrollToTop: true

  homepage:
    layout: "background"
    showRecent: true
    showRecentItems: 6
    cardView: true
    showMoreLink: true
    showMoreLinkDest: "/posts/"

  defaultBackgroundImage: "/media/6.jpg"
  # 跳过构建期 resources.GetRemote,直接使用外链 URL(避免 Douban 等 CDN 限流导致 build fail)
  hotlinkFeatureImage: true

  article:
    showComments: true
    showDate: true
    showAuthor: false
    showHero: true
    heroStyle: "big"
    showBreadcrumbs: true
    showReadingTime: true
    showTableOfContents: true
    showRelatedContent: true
    relatedContentLimit: 3
    showHeadingAnchors: true
    showPagination: true
    showTaxonomies: true

  list:
    showHero: true
    heroStyle: "background"
    showSummary: true
    showTableOfContents: true
    cardView: true
    showCards: true

  taxonomy:
    showHero: true
    heroStyle: "background"
    showTermCount: true

  term:
    showHero: true
    heroStyle: "background"
    cardView: true

  markup:
    highlight:
      noClasses: false
