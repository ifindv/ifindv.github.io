<button id=favor-modal-next>下一项 →</button></div></div></div><template id=favor-source><article data-favor data-id=dune-part-two data-type=movie data-title=沙丘:第二部 data-subtitle="Dune: Part Two (2024)" data-rating=9 data-date=2026-07-15 data-summary="维伦纽瓦的视觉史诗,Hans Zimmer 的配乐震撼到头皮发麻。" data-cover=https://image.tmdb.org/t/p/w780/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg data-source=影院 data-director="Denis Villeneuve" data-author data-publisher data-genre="科幻 / 史诗" data-location data-permalink=https://ifindv.github.io/favor/movies/dune-part-two/><div class=favor-source-body><p><em>维伦纽瓦的视觉史诗,Hans Zimmer 的配乐震撼到头皮发麻。</em></p><p>维伦纽瓦拍出了我理想中"科幻史诗"的样子。</p><h2 class="relative group">为什么是 9.0<div id=为什么是-90 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%ba%e4%bb%80%e4%b9%88%e6%98%af-90 aria-label=锚点>#</a></span></h2><ul><li><strong>视觉</strong>:沙虫登场那场戏,IMAX 厅里所有人都屏住呼吸</li><li><strong>配乐</strong>:Hans Zimmer 用低音提琴模拟沙虫的移动,延续了第一部的听觉语言</li><li><strong>节奏</strong>:3 个小时不拖沓,保罗的"宿命觉醒"过程写得很克制</li></ul><h2 class="relative group">让我难忘的场景<div id=让我难忘的场景 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%ae%a9%e6%88%91%e9%9a%be%e5%bf%98%e7%9a%84%e5%9c%ba%e6%99%af aria-label=锚点>#</a></span></h2><blockquote><p>&ldquo;I will be the voice&rdquo; — 保罗第一次直面弗雷曼人时的转变时刻</p></blockquote><h2 class="relative group">一些遗憾<div id=一些遗憾 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%80%e4%ba%9b%e9%81%97%e6%86%be aria-label=锚点>#</a></span></h2><p>中段有一段交代香料贸易规则的戏,信息密度过大,观众容易游离。结尾对保罗登基的处理略显仓促,期待第三部能撑起来。</p><h2 class="relative group">看完之后的反思<div id=看完之后的反思 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e7%9c%8b%e5%ae%8c%e4%b9%8b%e5%90%8e%e7%9a%84%e5%8f%8d%e6%80%9d aria-label=锚点>#</a></span></h2><p>权力、自由、宿命——这些母题被塞进了一个沙漠背景,但没有变轻。沙丘系列最厉害的地方,是它把"科幻"做成了"神话"。</p><h2 class="relative group">推荐给谁<div id=推荐给谁 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8e%a8%e8%8d%90%e7%bb%99%e8%b0%81 aria-label=锚点>#</a></span></h2><p>喜欢慢节奏史诗 / 对沙丘第一部意犹未尽 / 想体验 IMAX 顶级视听。</p></div></article><article data-favor data-id=zizhishinei data-type=book data-title=置身事内 data-subtitle="兰小欢 · 中国政府与经济发展" data-rating=9.3 data-date=2026-06-20 data-summary="理解中国过去 30 年经济奇迹的入门必读。" data-cover=https://img2.doubanio.com/view/subject/l/public/s34057491.jpg data-source=实体书 data-director data-author=兰小欢 data-publisher=上海人民出版社 data-genre data-location data-permalink=https://ifindv.github.io/favor/books/zizhishinei/><div class=favor-source-body><p><em>理解中国过去 30 年经济奇迹的入门必读。</em></p><p>这本书最厉害的地方,是把"中国奇迹"从神话还原成一系列可分析的政策选择。</p><h2 class="relative group">三大核心框架<div id=三大核心框架 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%89%e5%a4%a7%e6%a0%b8%e5%bf%83%e6%a1%86%e6%9e%b6 aria-label=锚点>#</a></span></h2><ol><li><strong>土地财政</strong>:地方政府如何靠"卖地"完成城市化原始积累</li><li><strong>招商引资</strong>:地方政府如何用税收优惠 + 土地优惠拼产业</li><li><strong>地方债务</strong>:高速增长背后的"系统性杠杆"</li></ol><h2 class="relative group">看完之后的现实视角<div id=看完之后的现实视角 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e7%9c%8b%e5%ae%8c%e4%b9%8b%e5%90%8e%e7%9a%84%e7%8e%b0%e5%ae%9e%e8%a7%86%e8%a7%92 aria-label=锚点>#</a></span></h2><ul><li>理解为什么房价不能崩</li><li>理解为什么地方政府这么"卷"</li><li>理解"投资拉动"模式的边界在哪</li></ul><h2 class="relative group">局限<div id=局限 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%b1%80%e9%99%90 aria-label=锚点>#</a></span></h2><p>出版于 2018 年,某些数据(尤其是 2020 年后的变化)已经过时。但框架依然有效。</p><h2 class="relative group">推荐给谁<div id=推荐给谁 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8e%a8%e8%8d%90%e7%bb%99%e8%b0%81 aria-label=锚点>#</a></span></h2><p>给所有想理解"中国是怎么运转的"的人,不论你是学生、公务员、还是做生意。</p></div></article><article data-favor data-id=oppenheimer data-type=movie data-title=奥本海默 data-subtitle="Oppenheimer (2023)" data-rating=8.5 data-date=2026-05-08 data-summary="诺兰拍出了'良心危机'的重量,Murphy 的眼神戏是教科书级别。" data-cover=https://image.tmdb.org/t/p/w780/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg data-source=影院 data-director="Christopher Nolan" data-author data-publisher data-genre="传记 / 历史" data-location data-permalink=https://ifindv.github.io/favor/movies/oppenheimer/><div class=favor-source-body><p><em>诺兰拍出了&rsquo;良心危机&rsquo;的重量,Murphy 的眼神戏是教科书级别。</em></p><p>诺兰这次在"形式服务于内容"上做到了极致——黑白与彩色的切换不是炫技,而是让观众体验奥本海默的主观世界。</p><h2 class="relative group">三条主线交织<div id=三条主线交织 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%89%e6%9d%a1%e4%b8%bb%e7%ba%bf%e4%ba%a4%e7%bb%87 aria-label=锚点>#</a></span></h2><ol><li><strong>奥本海默的政治迫害</strong>:施特劳斯的小心眼把科学家逼向绝路</li><li><strong>原子弹研发</strong>:沙漠里的曼哈顿计划,科学天才的"造物"时刻</li><li><strong>良心审判</strong>:投弹之后的余生,他一直在跟自己的影子说话</li></ol><h2 class="relative group">让我难忘的演员<div id=让我难忘的演员 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%ae%a9%e6%88%91%e9%9a%be%e5%bf%98%e7%9a%84%e6%bc%94%e5%91%98 aria-label=锚点>#</a></span></h2><ul><li><strong>Cillian Murphy</strong> — 蓝眼睛里的那种"看到深渊"的疲惫</li><li><strong>Robert Downey Jr.</strong> — 施特劳斯的反派处理非常克制,不是脸谱化</li><li><strong>Emily Blunt</strong> — 几场戏撑起了"被忽视的妻子"的全部重量</li></ul><h2 class="relative group">评分略降的原因<div id=评分略降的原因 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%af%84%e5%88%86%e7%95%a5%e9%99%8d%e7%9a%84%e5%8e%9f%e5%9b%a0 aria-label=锚点>#</a></span></h2><p>诺兰的政治线索铺得太密,3 小时里要塞下这么多人物关系图,有些段落(尤其是希瓦利埃案)节奏过快。</p><h2 class="relative group">推荐给谁<div id=推荐给谁 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8e%a8%e8%8d%90%e7%bb%99%e8%b0%81 aria-label=锚点>#</a></span></h2><p>诺兰粉丝 / 传记片爱好者 / 对二战历史感兴趣。</p></div></article><article data-favor data-id=kyoto-arashiyama data-type=trip data-title="京都 · 岚山" data-subtitle="Kansai · 2026 樱花季" data-rating=9.4 data-date=2026-04-02 data-summary=清晨的渡月桥没什么人,竹林小径里只有水滴声。 data-cover="https://images.unsplash.com/photo-1493997181344-712f2f19d87a?w=800&amp;q=80" data-source=日本 data-director data-author data-publisher data-genre data-location="Japan · Kyoto" data-permalink=https://ifindv.github.io/favor/trips/kyoto-arashiyama/><div class=favor-source-body><p><em>清晨的渡月桥没什么人,竹林小径里只有水滴声。</em></p><p>4 月 2 日,清晨 6 点半。岚山几乎没有游客。</p><h2 class="relative group">当天行程<div id=当天行程 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%bd%93%e5%a4%a9%e8%a1%8c%e7%a8%8b aria-label=锚点>#</a></span></h2><ul><li>06:30 渡月桥(包场)</li><li>07:30 竹林小径(光线穿透竹叶,像一场默片)</li><li>09:00 常寂光寺(被猫叫醒的禅意)</li><li>12:00 嵯峨野竹林午餐(豆腐料理)</li><li>14:00 岚山小火车(樱花隧道)</li><li>17:00 鸭川河畔散步</li></ul><h2 class="relative group">让我难忘的瞬间<div id=让我难忘的瞬间 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%ae%a9%e6%88%91%e9%9a%be%e5%bf%98%e7%9a%84%e7%9e%ac%e9%97%b4 aria-label=锚点>#</a></span></h2><blockquote><p>竹林里那段 200 米,我走了 30 分钟。</p></blockquote><p>不是迷路,是不想快。光斑在石板上跳舞,风过来的时候竹叶像下雨。</p><h2 class="relative group">一个细节<div id=一个细节 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%80%e4%b8%aa%e7%bb%86%e8%8a%82 aria-label=锚点>#</a></span></h2><p>日本神社前的"手水舍"礼仪:用长柄木勺接水,先洗左手再洗右手,再用水漱口,最后用柄部盛水冲洗勺柄。这个顺序背下来后,整个过程像一场小型的冥想。</p><h2 class="relative group">拍照 vs 体验<div id=拍照-vs-体验 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8b%8d%e7%85%a7-vs-%e4%bd%93%e9%aa%8c aria-label=锚点>#</a></span></h2><p>樱花季的岚山是拍照圣地,但我建议:拍两张就够了。剩下的时间,留给眼睛。</p><h2 class="relative group">实用信息<div id=实用信息 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%ae%9e%e7%94%a8%e4%bf%a1%e6%81%af aria-label=锚点>#</a></span></h2><ul><li><strong>交通</strong>:JR 嵯峨野线到"嵯峨岚山站",步行 10 分钟</li><li><strong>最佳时间</strong>:4 月上旬(樱花) / 11 月下旬(红叶),<strong>避开黄金周</strong></li><li><strong>预算</strong>:一天 ¥15,000(交通 + 餐 + 小火车)</li></ul></div></article><article data-favor data-id=yi-yi data-type=movie data-title=一一 data-subtitle="Yi Yi (2000)" data-rating=9.5 data-date=2025-12-22 data-summary="杨德昌的家庭史诗,'我们读到的只是表面'。" data-cover=https://image.tmdb.org/t/p/w780/8WMx49yZzeX0BoCLp0K3M4yZ4FP.jpg data-source=重看 data-director=杨德昌 data-author data-publisher data-genre="家庭 / 剧情" data-location data-permalink=https://ifindv.github.io/favor/movies/yi-yi/><div class=favor-source-body><p><em>杨德昌的家庭史诗,&lsquo;我们读到的只是表面&rsquo;。</em></p><p>每次重看都有新的共鸣,这次看完,我已经不再 25 岁了。</p><h2 class="relative group">为什么给 9.5<div id=为什么给-95 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%ba%e4%bb%80%e4%b9%88%e7%bb%99-95 aria-label=锚点>#</a></span></h2><blockquote><p>&ldquo;电影发明以后,人类的生命比以前至少延长了三倍。&rdquo; ——《一一》台词</p></blockquote><p>这不是技术炫耀,而是杨德昌拍这部电影的核心理由。三小时的银幕时间里,他让你活过一家五口的几个关键节点。</p><h2 class="relative group">三条人物线<div id=三条人物线 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%89%e6%9d%a1%e4%ba%ba%e7%89%a9%e7%ba%bf aria-label=锚点>#</a></span></h2><ul><li><strong>NJ(父亲)</strong>:中年危机不是没钱没事业,而是"我曾经有机会活另一种人生"</li><li><strong>洋洋(小儿子)</strong>:他的"看后脑勺"哲学是这个时代最稀缺的——不带滤镜地看世界</li><li><strong>敏敏(母亲)</strong>:在山上悟道的那段戏,杨德昌用最克制的镜头讲最大的道理</li></ul><h2 class="relative group">二十年后再看<div id=二十年后再看 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%ba%8c%e5%8d%81%e5%b9%b4%e5%90%8e%e5%86%8d%e7%9c%8b aria-label=锚点>#</a></span></h2><p>第一次看是大学,觉得节奏慢。这次再看,觉得每个停顿都是必要的。生活本就是这样——很多事没有转折,只是"继续"。</p><h2 class="relative group">推荐给谁<div id=推荐给谁 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8e%a8%e8%8d%90%e7%bb%99%e8%b0%81 aria-label=锚点>#</a></span></h2><p>给所有在某个深夜怀疑过"我所做的一切有没有意义"的人。</p></div></article><article data-favor data-id=thinking-fast-and-slow data-type=book data-title=思考,快与慢 data-subtitle="Daniel Kahneman" data-rating=9 data-date=2025-11-30 data-summary="系统 1 / 系统 2 的框架,做产品决策时还在用。" data-cover=https://img2.doubanio.com/view/subject/l/public/s2768378.jpg data-source=Kindle data-director data-author="Daniel Kahneman" data-publisher=中信出版社 data-genre data-location data-permalink=https://ifindv.github.io/favor/books/thinking-fast-and-slow/><div class=favor-source-body><p><em>系统 1 / 系统 2 的框架,做产品决策时还在用。</em></p><p>诺奖得主 Kahneman 把毕生研究浓缩成这本书。30 年研究精华,适合任何做决策的人读。</p><h2 class="relative group">核心框架<div id=核心框架 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%a0%b8%e5%bf%83%e6%a1%86%e6%9e%b6 aria-label=锚点>#</a></span></h2><ul><li><strong>系统 1</strong>:快思考,直觉,自动,节能</li><li><strong>系统 2</strong>:慢思考,理性,刻意,耗能</li></ul><p>人类大多数决策都是系统 1 做的,但我们误以为是系统 2。</p><h2 class="relative group">我常用的三个启发法<div id=我常用的三个启发法 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%88%91%e5%b8%b8%e7%94%a8%e7%9a%84%e4%b8%89%e4%b8%aa%e5%90%af%e5%8f%91%e6%b3%95 aria-label=锚点>#</a></span></h2><ol><li><strong>锚定效应</strong>:任何谈判的"第一个数字"会影响后续所有讨论</li><li><strong>可得性启发</strong>:我们高估"我能想到的"事情的发生概率</li><li><strong>禀赋效应</strong>:一旦拥有,估值就立刻上涨——跳槽时容易踩这个坑</li></ol><h2 class="relative group">推荐给谁<div id=推荐给谁 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8e%a8%e8%8d%90%e7%bb%99%e8%b0%81 aria-label=锚点>#</a></span></h2><p>给所有做产品、做投资、做决策的人。每隔一两年重读,会发现自己又有了新理解。</p></div></article><article data-favor data-id=iceland-golden-circle data-type=trip data-title="冰岛 · 黄金圈" data-subtitle="Reykjavik · 极光与瀑布" data-rating=9.7 data-date=2025-11-08 data-summary="辛格韦德利瀑布的彩虹、Geysir 的喷发、冰河湖的钻石冰。" data-cover="https://images.unsplash.com/photo-1504829857797-ddff29c27927?w=800&amp;q=80" data-source=冰岛 data-director data-author data-publisher data-genre data-location="Iceland · Reykjavík" data-permalink=https://ifindv.github.io/favor/trips/iceland-golden-circle/><div class=favor-source-body><p><em>辛格韦德利瀑布的彩虹、Geysir 的喷发、冰河湖的钻石冰。</em></p><p>11 月,冰岛的极夜刚开始。我们从雷克雅未克出发,逆时针环岛 7 天。</p><h2 class="relative group">三条核心线路<div id=三条核心线路 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%89%e6%9d%a1%e6%a0%b8%e5%bf%83%e7%ba%bf%e8%b7%af aria-label=锚点>#</a></span></h2><ol><li><strong>黄金圈一日游</strong>:辛格韦德利 + 黄金瀑布 + 间歇泉(游客经典路线)</li><li><strong>南海岸</strong>:黑沙滩 + 冰河湖 + 钻石冰沙滩(本次最震撼)</li><li><strong>斯奈山半岛</strong>:草帽山 + 黑教堂(电影感拉满)</li></ol><h2 class="relative group">让我沉默的瞬间<div id=让我沉默的瞬间 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%ae%a9%e6%88%91%e6%b2%89%e9%bb%98%e7%9a%84%e7%9e%ac%e9%97%b4 aria-label=锚点>#</a></span></h2><blockquote><p>钻石冰沙滩。我们走过去的时候是晚上 11 点,天完全黑了。</p></blockquote><p>管理员用手电筒指着一块冰:&ldquo;这是 1000 年前的冰,被冰川带下来的。&rdquo;</p><p>手电光打过去,冰块像一块没有切割过的钻石。</p><h2 class="relative group">极光追捕<div id=极光追捕 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%9e%81%e5%85%89%e8%bf%bd%e6%8d%95 aria-label=锚点>#</a></span></h2><ul><li>11 月 6 日:第一次看到极光,司机把车停在路边,大家尖叫</li><li>11 月 8 日:冰河湖边,极光在跳舞,我们哭得像个傻子</li></ul><h2 class="relative group">一些不愉快的真相<div id=一些不愉快的真相 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%80%e4%ba%9b%e4%b8%8d%e6%84%89%e5%bf%ab%e7%9a%84%e7%9c%9f%e7%9b%b8 aria-label=锚点>#</a></span></h2><ul><li>11 月冰岛基本每天下雨/雪,日照只有 5 小时</li><li>风大到能把车门吹坏</li><li>吃一周羊肉和鳕鱼后,你会想念中餐</li></ul><h2 class="relative group">实用信息<div id=实用信息 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%ae%9e%e7%94%a8%e4%bf%a1%e6%81%af aria-label=锚点>#</a></span></h2><ul><li><strong>签证</strong>:申根</li><li><strong>交通</strong>:强烈建议租 4WD SUV</li><li><strong>预算</strong>:7 天 ¥25,000(机酒车吃)</li><li><strong>必修</strong>:冲锋衣、抓绒、保暖内衣、保暖羊毛袜</li></ul></div></article><article data-favor data-id=blade-runner-2049 data-type=movie data-title="银翼杀手 2049" data-subtitle="Blade Runner 2049 (2017)" data-rating=8.8 data-date=2025-09-30 data-summary="雨、雪、雾的银幕美学,Roger Deakins 封神之作。" data-cover=https://image.tmdb.org/t/p/w780/gajva2L0rPYkEWjzgFlBXCAVBE5.jpg data-source="4K 蓝光" data-director="Denis Villeneuve" data-author data-publisher data-genre="科幻 / 黑色" data-location data-permalink=https://ifindv.github.io/favor/movies/blade-runner-2049/><div class=favor-source-body><p><em>雨、雪、雾的银幕美学,Roger Deakins 封神之作。</em></p><p>维伦纽瓦 + Roger Deakins + Hans Zimmer 的组合,把这个续集抬到了"科幻电影艺术片"的位置。</p><h2 class="relative group">摄影封神<div id=摄影封神 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%91%84%e5%bd%b1%e5%b0%81%e7%a5%9e aria-label=锚点>#</a></span></h2><p>Deakins 在这部片里把"光"做成了主角:</p><ul><li>复制人 K 公寓的橙色污染</li><li>拉斯维加斯废墟的黄色尘暴</li><li>雪地追车那场戏的纯净白</li></ul><blockquote><p>这部片如果你跳过任何一帧,都是在浪费 Deakins 的灯光。</p></blockquote><h2 class="relative group">关于"灵魂"的拷问<div id=关于灵魂的拷问 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%85%b3%e4%ba%8e%e7%81%b5%e9%ad%82%e7%9a%84%e6%8b%b7%e9%97%ae aria-label=锚点>#</a></span></h2><p>K 的故事线其实是个古典悲剧——一个"以为自己特殊的人,最终发现自己只是普通人"。</p><p>Deckard 那场戏被剪辑得极克制,但你看完会明白:父女之间不需要台词确认,摄影机已经告诉你了。</p><h2 class="relative group">为什么没有给 9.0<div id=为什么没有给-90 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%ba%e4%bb%80%e4%b9%88%e6%b2%a1%e6%9c%89%e7%bb%99-90 aria-label=锚点>#</a></span></h2><p>节奏对普通观众不够友好。中段乡村段落略散,情感铺垫不像诺兰那么密集。但不影响它是一部<strong>视觉杰作</strong>。</p></div></article><article data-favor data-id=yili-sailimu data-type=trip data-title="伊犁 · 赛里木湖" data-subtitle="新疆 · 蓝梦之境" data-rating=9.5 data-date=2025-08-15 data-summary=雪山倒映在湖面,湖水蓝得不真实。 data-cover="https://images.unsplash.com/photo-1565967511849-76a60a516170?w=800&amp;q=80" data-source=新疆 data-director data-author data-publisher data-genre data-location="China · Xinjiang" data-permalink=https://ifindv.github.io/favor/trips/yili-sailimu/><div class=favor-source-body><p><em>雪山倒映在湖面,湖水蓝得不真实。</em></p><p>从乌鲁木齐出发,自驾 5 小时到达赛里木湖。这是新疆之行的高潮。</p><h2 class="relative group">湖区玩法<div id=湖区玩法 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%b9%96%e5%8c%ba%e7%8e%a9%e6%b3%95 aria-label=锚点>#</a></span></h2><ul><li><strong>东门进,南门出</strong>:逆时针环湖 92 公里</li><li><strong>最佳拍照点</strong>:克勒涌珠(看天鹅)+ 点将台(看全景)</li><li><strong>人少时段</strong>:清晨 6-9 点(避开旅行团)</li></ul><h2 class="relative group">让我难忘的一小时<div id=让我难忘的一小时 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%ae%a9%e6%88%91%e9%9a%be%e5%bf%98%e7%9a%84%e4%b8%80%e5%b0%8f%e6%97%b6 aria-label=锚点>#</a></span></h2><p>湖边开满野花的那一个小时,我什么都没想。</p><p>坐在木栈道上,风过来,湖面泛鳞光,远处是连绵的雪山。手机信号满格,但我没有看。</p><h2 class="relative group">一些"内行"玩法<div id=一些内行玩法 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%80%e4%ba%9b%e5%86%85%e8%a1%8c%e7%8e%a9%e6%b3%95 aria-label=锚点>#</a></span></h2><ul><li><strong>住一晚赛里木湖蒙古包</strong>:晚上可以看到银河 + 雪山倒影</li><li><strong>果子沟大桥</strong>:返程必经,免费的高速公路景观</li><li><strong>霍尔果斯口岸</strong>:如果对中亚感兴趣,顺路看看</li></ul><h2 class="relative group">实用信息<div id=实用信息 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%ae%9e%e7%94%a8%e4%bf%a1%e6%81%af aria-label=锚点>#</a></span></h2><ul><li><strong>自驾</strong>:新疆路况好,但限速严,自驾 5-6 小时要预留</li><li><strong>最佳季节</strong>:6 月野花 / 7-8 月避暑 / 9 月秋色</li><li><strong>预算</strong>:4 天 ¥5,000(自驾)</li><li><strong>必备</strong>:防晒霜、保湿、墨镜(紫外线极强)</li></ul></div></article><article data-favor data-id=sapiens data-type=book data-title=人类简史 data-subtitle="Yuval Noah Harari" data-rating=8.6 data-date=2025-07-12 data-summary=宏大叙事的天花板。虚构故事、认知革命、农业陷阱。 data-cover=https://img2.doubanio.com/view/subject/l/public/s27814883.jpg data-source=实体书 data-director data-author="Yuval Noah Harari" data-publisher=中信出版社 data-genre data-location data-permalink=https://ifindv.github.io/favor/books/sapiens/><div class=favor-source-body><p><em>宏大叙事的天花板。虚构故事、认知革命、农业陷阱。</em></p><p>Harari 这本 2014 年的书依然不过时——因为它讨论的不是"事件",而是"框架"。</p><h2 class="relative group">三个"虚构的故事"<div id=三个虚构的故事 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%89%e4%b8%aa%e8%99%9a%e6%9e%84%e7%9a%84%e6%95%85%e4%ba%8b aria-label=锚点>#</a></span></h2><p>Harari 认为,人类能超越其他物种的关键是:</p><ol><li><strong>想象虚构实体</strong>:公司、国家、货币、神——这些都是"想象"</li><li><strong>大规模协作</strong>:因为大家都相信同一套虚构,所以能一起做事</li><li><strong>灵活演化</strong>:虚构可以不断更新,基因不行</li></ol><h2 class="relative group">农业革命是陷阱?<div id=农业革命是陷阱 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%86%9c%e4%b8%9a%e9%9d%a9%e5%91%bd%e6%98%af%e9%99%b7%e9%98%b1 aria-label=锚点>#</a></span></h2><p>这个观点争议很大但很深刻:</p><blockquote><p>&ldquo;农业革命不是人类驯化了小麦,而是小麦驯化了人类。&rdquo;</p></blockquote><p>我们的祖先 1 万年前从狩猎采集生活"升级"到农业,但实际上是把自己绑死在一块地上,工作量反而增加。</p><h2 class="relative group">让我重新思考的事<div id=让我重新思考的事 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%ae%a9%e6%88%91%e9%87%8d%e6%96%b0%e6%80%9d%e8%80%83%e7%9a%84%e4%ba%8b aria-label=锚点>#</a></span></h2><ul><li>民族主义、企业、资本主义——这些都是"想象共同体"</li><li>幸福感和物质进步不成正比(伊斯特林悖论)</li></ul><h2 class="relative group">局限<div id=局限 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%b1%80%e9%99%90 aria-label=锚点>#</a></span></h2><p>后两部比第一部松散,前 200 页最好。</p></div></article><article data-favor data-id=in-the-mood-for-love data-type=movie data-title=花样年华 data-subtitle="In the Mood for Love (2000)" data-rating=9.2 data-date=2025-04-18 data-summary=王家卫的克制美学教科书。走廊、楼梯、旗袍、雨夜。 data-cover=https://image.tmdb.org/t/p/w780/iYypPT4bhqXfn1A6kasvpy4uVSo.jpg data-source=流媒体 data-director=王家卫 data-author data-publisher data-genre="爱情 / 文艺" data-location data-permalink=https://ifindv.github.io/favor/movies/in-the-mood-for-love/><div class=favor-source-body><p><em>王家卫的克制美学教科书。走廊、楼梯、旗袍、雨夜。</em></p><p>王家卫最厉害的地方是:他可以让一对男女从头到尾没接吻,但你看完之后,觉得他们之间发生了一切。</p><h2 class="relative group">视觉的克制<div id=视觉的克制 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%a7%86%e8%a7%89%e7%9a%84%e5%85%8b%e5%88%b6 aria-label=锚点>#</a></span></h2><ul><li>张曼玉每场戏换一件旗袍,花的图案暗示她内心的变化</li><li>梁朝伟靠墙抽烟的镜头,永远是 1/3 黄金分割</li><li>慢门拉出的红色灯光,在走廊里把两个人永远隔开一段距离</li></ul><blockquote><p>这部电影的"留白"比台词多得多。</p></blockquote><h2 class="relative group">关于"未发生的事"<div id=关于未发生的事 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%85%b3%e4%ba%8e%e6%9c%aa%e5%8f%91%e7%94%9f%e7%9a%84%e4%ba%8b aria-label=锚点>#</a></span></h2><p>周慕云和苏丽珍的关系,是那种"如果 1962 年香港多一扇门,可能一切都会不同"的假设。但王家卫拒绝给你这个"如果"。</p><p>结尾周慕云对着吴哥窟的树洞说完秘密、用泥封上的时候,你知道——他永远不会告诉苏丽珍。</p><h2 class="relative group">25 年后再看<div id=25-年后再看 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#25-%e5%b9%b4%e5%90%8e%e5%86%8d%e7%9c%8b aria-label=锚点>#</a></span></h2><p>年少时觉得这是爱情片,现在觉得这是<strong>关于人如何与自己的欲望共处</strong>的电影。</p></div></article><article data-favor data-id=code-complete-2 data-type=book data-title="代码大全 2" data-subtitle="Steve McConnell" data-rating=9 data-date=2025-03-05 data-summary="软件工程领域的'字典',每隔一两年重读都有新东西。" data-cover=https://img2.doubanio.com/view/subject/l/public/s1229240.jpg data-source=实体书 data-director data-author="Steve McConnell" data-publisher=电子工业出版社 data-genre data-location data-permalink=https://ifindv.github.io/favor/books/code-complete-2/><div class=favor-source-body><p><em>软件工程领域的&rsquo;字典&rsquo;,每隔一两年重读都有新东西。</em></p><p>900 多页的"软件工程圣经",每个工程师书架上都该放一本。</p><h2 class="relative group">为什么给 9.0<div id=为什么给-90 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%ba%e4%bb%80%e4%b9%88%e7%bb%99-90 aria-label=锚点>#</a></span></h2><p>不是教你某门语言,而是教你"如何写出可读的、可维护的代码"。</p><h2 class="relative group">最重要的章节<div id=最重要的章节 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%9c%80%e9%87%8d%e8%a6%81%e7%9a%84%e7%ab%a0%e8%8a%82 aria-label=锚点>#</a></span></h2><ul><li>第 5 章:软件构建中的设计</li><li>第 6 章:工作中的类</li><li>第 9-11 章:变量、语句、组织代码</li><li>第 14 章:组织直线型代码</li><li>第 18 章:表驱动法</li></ul><h2 class="relative group">跨越语言的指导<div id=跨越语言的指导 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%b7%a8%e8%b6%8a%e8%af%ad%e8%a8%80%e7%9a%84%e6%8c%87%e5%af%bc aria-label=锚点>#</a></span></h2><p>不管你写 JavaScript、Python 还是 Rust,这些原则都适用。</p><h2 class="relative group">唯一缺点<div id=唯一缺点 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%94%af%e4%b8%80%e7%bc%ba%e7%82%b9 aria-label=锚点>#</a></span></h2><p>太厚了,通勤基本别想。但作为参考书,随时翻一段都很值。</p><h2 class="relative group">推荐给谁<div id=推荐给谁 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8e%a8%e8%8d%90%e7%bb%99%e8%b0%81 aria-label=锚点>#</a></span></h2><p>工作 1-3 年的工程师,会立刻见效。工作 5+ 年的人,可以补充一些之前不知道的最佳实践。</p></div></article><article data-favor data-id=robot-dreams data-type=movie data-title=机器人之梦 data-subtitle="Robot Dreams (2023)" data-rating=8.7 data-date=2025-02-14 data-summary=全程没有一句对白,看完沉默很久。 data-cover=https://image.tmdb.org/t/p/w780/4zfTUGBftXMJ68XMtY1LF9pmm8k.jpg data-source=流媒体 data-director="Pablo Berger" data-author data-publisher data-genre="动画 / 默片" data-location data-permalink=https://ifindv.github.io/favor/movies/robot-dreams/><div class=favor-source-body><p><em>全程没有一句对白,看完沉默很久。</em></p><p>120 分钟,一个单词都没有。但它是 2023 年我看过的最贵的电影。</p><h2 class="relative group">默片的回归<div id=默片的回归 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e9%bb%98%e7%89%87%e7%9a%84%e5%9b%9e%e5%bd%92 aria-label=锚点>#</a></span></h2><p>不是出于技术限制,而是主动选择。导演 Berger 用图像和声音构建了所有情感。</p><blockquote><p>一个孤独的狗 + 一个被装进箱子的机器人 + 一个夏天 + 一个再也没能相见的重逢。</p></blockquote><h2 class="relative group">让我沉默的细节<div id=让我沉默的细节 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%ae%a9%e6%88%91%e6%b2%89%e9%bb%98%e7%9a%84%e7%bb%86%e8%8a%82 aria-label=锚点>#</a></span></h2><ul><li>机器人独自在海滩上等待的那个长镜头</li><li>狗找到新朋友时,机器人那个侧身的转头</li><li>结尾狗在街上听到相似旋律,回头,机器人也在另一条街停下——两个镜头切了 6 次</li></ul><h2 class="relative group">拷问的命题<div id=拷问的命题 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8b%b7%e9%97%ae%e7%9a%84%e5%91%bd%e9%a2%98 aria-label=锚点>#</a></span></h2><blockquote><p>&ldquo;爱一个人,是不是一定要拥有?&rdquo;</p></blockquote><p>这部片给出的答案是:<strong>不是</strong>。但失去不意味着不再爱,而是学会带着这份爱继续生活。</p><h2 class="relative group">适合重看的瞬间<div id=适合重看的瞬间 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e9%80%82%e5%90%88%e9%87%8d%e7%9c%8b%e7%9a%84%e7%9e%ac%e9%97%b4 aria-label=锚点>#</a></span></h2><p>每次你觉得人生某个"错过"过不去的时候,就看一遍这部片。</p></div></article><article data-favor data-id=chiangmai-pai data-type=trip data-title="清迈 · 拜县" data-subtitle="Chiang Mai · 山城与咖啡" data-rating=8.8 data-date=2025-01-18 data-summary=骑摩托车上山的路让人心脏狂跳,但山顶的咖啡值回一切。 data-cover="https://images.unsplash.com/photo-1598970434795-0c54fe7c0648?w=800&amp;q=80" data-source=泰国 data-director data-author data-publisher data-genre data-location="Thailand · Pai" data-permalink=https://ifindv.github.io/favor/trips/chiangmai-pai/><div class=favor-source-body><p><em>骑摩托车上山的路让人心脏狂跳,但山顶的咖啡值回一切。</em></p><p>清迈到拜县,135 公里 762 个弯。我骑摩托车上去的。</p><h2 class="relative group">山路体验<div id=山路体验 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%b1%b1%e8%b7%af%e4%bd%93%e9%aa%8c aria-label=锚点>#</a></span></h2><ul><li><strong>前半段</strong>:平缓,甘蔗田和橡胶林</li><li><strong>中段</strong>:开始有连续发卡弯,体力开始消耗</li><li><strong>最后 30 公里</strong>:最危险,雨后路面打滑 + 大货车多</li></ul><blockquote><p>我没出过事故。但路过的两个欧洲背包客有摔车痕迹。</p></blockquote><h2 class="relative group">拜县必须做的 5 件事<div id=拜县必须做的-5-件事 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%8b%9c%e5%8e%bf%e5%bf%85%e9%a1%bb%e5%81%9a%e7%9a%84-5-%e4%bb%b6%e4%ba%8b aria-label=锚点>#</a></span></h2><ol><li><strong>黄色小屋</strong> (Cafe in Love) — 拍照打卡经典</li><li><strong>二战桥</strong> — 看日落 + 大秋秋</li><li><strong>草莓园</strong> — 草莓季去(11-2 月)</li><li><strong>拜县峡谷</strong> (Pai Canyon) — 看日出的地方,有点险</li><li><strong>云来观景台</strong> — 看云海</li></ol><h2 class="relative group">我喜欢拜县的原因<div id=我喜欢拜县的原因 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e6%88%91%e5%96%9c%e6%ac%a2%e6%8b%9c%e5%8e%bf%e7%9a%84%e5%8e%9f%e5%9b%a0 aria-label=锚点>#</a></span></h2><p>这里有清迈没有的"安静"。清迈古城现在游客太多了,但拜县依然保留着一种"你来这里就要慢下来"的氛围。</p><h2 class="relative group">实用信息<div id=实用信息 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e5%ae%9e%e7%94%a8%e4%bf%a1%e6%81%af aria-label=锚点>#</a></span></h2><ul><li><strong>摩托</strong>:一定要有驾照,头盔必须戴</li><li><strong>保险</strong>:确认租车的保险是否覆盖山路事故</li><li><strong>最佳季节</strong>:11 月-2 月凉季,避开 3-4 月焚烧季(空气差)</li><li><strong>预算</strong>:拜县 3 天 ¥2,500</li></ul></div></article><article data-favor data-id=chang-an-de-li-zhi data-type=book data-title=长安的荔枝 data-subtitle=马伯庸 data-rating=8.4 data-date=2024-12-10 data-summary="一个唐朝打工人在 KPI 倒计时下绝处逢生。" data-cover=https://img2.doubanio.com/view/subject/l/public/s34713734.jpg data-source=微信读书 data-director data-author=马伯庸 data-publisher=湖南文艺出版社 data-genre data-location data-permalink=https://ifindv.github.io/favor/books/chang-an-de-li-zhi/><div class=favor-source-body><p><em>一个唐朝打工人在 KPI 倒计时下绝处逢生。</em></p><p>7 万字,一个下午读完。马伯庸的"小人物扛大任务"系列巅峰。</p><h2 class="relative group">一句话简介<div id=一句话简介 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%b8%80%e5%8f%a5%e8%af%9d%e7%ae%80%e4%bb%8b aria-label=锚点>#</a></span></h2><blockquote><p>唐朝皇帝要在贵妃生日时吃到岭南鲜荔枝。一个九品小吏被选中完成这个"不可能任务"。</p></blockquote><h2 class="relative group">作为打工人共鸣的点<div id=作为打工人共鸣的点 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e4%bd%9c%e4%b8%ba%e6%89%93%e5%b7%a5%e4%ba%ba%e5%85%b1%e9%b8%a3%e7%9a%84%e7%82%b9 aria-label=锚点>#</a></span></h2><ul><li><strong>资源限制</strong>:预算不足,但老板要求不变</li><li><strong>路径博弈</strong>:6 月岭南没有新鲜荔枝,得想运输方案</li><li><strong>内卷焦虑</strong>:周边同事都等着看你笑话</li><li><strong>合理化目标</strong>:最后完成任务,但代价是什么?</li></ul><h2 class="relative group">让我难忘的一句话<div id=让我难忘的一句话 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e8%ae%a9%e6%88%91%e9%9a%be%e5%bf%98%e7%9a%84%e4%b8%80%e5%8f%a5%e8%af%9d aria-label=锚点>#</a></span></h2><blockquote><p>&ldquo;流程,是为了让大家都失败时能推卸责任。&rdquo;</p></blockquote><h2 class="relative group">看完之后的现实感<div id=看完之后的现实感 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e7%9c%8b%e5%ae%8c%e4%b9%8b%e5%90%8e%e7%9a%84%e7%8e%b0%e5%ae%9e%e6%84%9f aria-label=锚点>#</a></span></h2><p>如果你在互联网公司做项目管理,看这本书会笑出声——1200 年前的官场和今天的职场,底层逻辑一模一样。</p><h2 class="relative group">适合送谁<div id=适合送谁 class=anchor></div><span class="absolute top-0 w-6 transition-opacity opacity-0 -start-6 not-prose group-hover:opacity-100 select-none"><a class="text-primary-300 dark:text-neutral-700 !no-underline" href=#%e9%80%82%e5%90%88%e9%80%81%e8%b0%81 aria-label=锚点>#</a></span></h2><p>送给你那位天天被"最后期限"折磨的朋友。</p></div></article></template><link rel=stylesheet href=/css/favor.min.6efffae737ba6d0345f251450bbfadf0eab61288074e90b8de26f2c6743da9c2f264ee2cc67b1e76507748f221d90a163b1935fd7146612d622e30dbe77942f8.css integrity="sha512-bv/65ze6bQNF8lFFC7+t8Oq2EogHTpC43ibyxnQ9qcLyZO4sxnsedlB3SPIh2QoWOxk1/XFGYS1iLjDb53lC+A=="><script type=text/javascript src=/js/favor.min.f592b7e8b15c4a37c7bf0afeea73ec5351a81a63b0ce004bdaed03f7e6994ff9977108ae60e6cbdfd280fc7543884434fe158f3e429a61e839484ae0438c5df2.js integrity="sha512-9ZK36LFcSjfHvwr+6nPsU1GoGmOwzgBL2u0D9+aZT/mXcQiuYObL39KA/HVDiEQ0/hWPPkKaYeg5SErgQ4xd8g==" defer></script></article><div id=scroll-to-top class="fixed bottom-6 end-6 z-50 transform translate-y-4 opacity-0 duration-200"><a href=#the-top class="pointer-events-auto flex h-12 w-12 items-center justify-center rounded-full bg-neutral/50 text-xl text-neutral-700 hover:text-primary-600 dark:bg-neutral-800/50 dark:text-neutral dark:hover:text-primary-400" aria-label=返回顶部 title=返回顶部>&uarr;</a></div></main><footer id=site-footer class="py-10 print:hidden"><div class="flex items-center justify-between"><p class="text-sm text-neutral-500 dark:text-neutral-400">&copy;
