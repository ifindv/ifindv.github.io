# ===== 个人项目 =====
#
# icon 填 assets/ 下的相对路径；status 是卡片右上角的小徽章；
# tags 是技术栈标签；external 为 true 时链接指向站外而不是站内页面。
projects:
  - name: "Termini"
    description: "面向 SSH 与本地终端的桌面客户端。多标签会话、SFTP 文件传输、端口转发与 SOCKS5、串口与 ZMODEM、命令片段。数据全部留在本机，无遥测。"
    url: "/termini/"
    icon: "img/termini/icon.png"
    status: "持续更新"
    tags: ["Rust", "Tauri", "SSH", "SFTP"]

# ===== 站点数据 =====
#
# 数字由模板按内容分区实时统计，key 对应 content/ 下的目录名。
# icon 是统计项前面的小图标，指向 assets/icons/<icon>.svg，
# 也可以填主题自带的图标名。想加自定义统计项就在下面追加一行。
stats:
  - label: "篇文章"
    key: "posts"
    icon: "file-lines"

  - label: "本书"
    key: "books"
    icon: "book-open"

  - label: "部影"
    key: "movies"
    icon: "clapperboard"

  - label: "次旅行"
    key: "trips"
    icon: "location-dot"

# ===== 个人资料（暂未在页面上渲染）=====
#
# 顶部的资料卡已经从关于页面拿掉了，下面这份资料暂时没有出口，
# 先留在这里；要加回资料卡的话，从 git 历史里取回模板片段即可。
name: "ifindv"

# 头像。填 assets/ 下的相对路径（如 img/avatar.jpg），会走 Hugo 资源管线
avatar: "img/avatar.jpg"

# 一句话身份，放在名字下面
headline: "开发者 · 技术写作者"

# 自我介绍，支持 Markdown
bio: >
  写代码、折腾工具、顺手记点笔记。
  这里主要放技术文章、项目进展和一些不太成熟的想法。

# 所在地，可留空
location: "中国"
